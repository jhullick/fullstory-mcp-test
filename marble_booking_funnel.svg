<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="430" fill="#ffffff"/>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#1a1a2e">MARBLE Booking Funnel</text>
  <text x="40" y="66" font-size="14" fill="#6b6b80">Sessions per step · 14 May – 28 May 2026 · independent counts (not sequenced)</text>

  <!-- Step 1: Intent -->
  <rect x="40" y="92" width="740" height="56" rx="6" fill="#3a86ff"/>
  <text x="56" y="119" font-size="16" font-weight="600" fill="#ffffff">1 · Intent</text>
  <text x="56" y="138" font-size="12" fill="#dce8ff">booking_intentShown</text>
  <text x="764" y="127" font-size="18" font-weight="700" fill="#ffffff" text-anchor="end">124,913</text>

  <!-- Step 2: Search (4.4% of step1 width => ~33px, use min width for label) -->
  <rect x="40" y="168" width="40" height="56" rx="6" fill="#8338ec"/>
  <text x="92" y="195" font-size="16" font-weight="600" fill="#1a1a2e">2 · Search</text>
  <text x="92" y="214" font-size="12" fill="#6b6b80">milano:booking_searched</text>
  <text x="764" y="203" font-size="18" font-weight="700" fill="#1a1a2e" text-anchor="end">5,557</text>

  <!-- Step 3: Started (70.5% => ~522px) -->
  <rect x="40" y="244" width="522" height="56" rx="6" fill="#ff6b35"/>
  <text x="56" y="271" font-size="16" font-weight="600" fill="#ffffff">3 · Started</text>
  <text x="56" y="290" font-size="12" fill="#ffe2d6">booking_started</text>
  <text x="578" y="279" font-size="18" font-weight="700" fill="#1a1a2e" text-anchor="start">88,010</text>

  <!-- Step 4: Confirmed (2.1% => ~16px) -->
  <rect x="40" y="320" width="20" height="56" rx="6" fill="#06a77d"/>
  <text x="72" y="347" font-size="16" font-weight="600" fill="#1a1a2e">4 · Confirmed</text>
  <text x="72" y="366" font-size="12" fill="#6b6b80">milano:booking_confirmed</text>
  <text x="764" y="355" font-size="18" font-weight="700" fill="#1a1a2e" text-anchor="end">2,668</text>

  <text x="40" y="410" font-size="12" fill="#b00020">Note: steps mix generic (intent/started) and Milano-scoped (search/confirmed) events, so volumes are not directly comparable.</text>
</svg>
